    container_name: ezclick-weather-web
    restart: unless-stopped
    network_mode: host
    mem_limit: 256m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./current:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config: