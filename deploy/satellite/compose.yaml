services:
  satellite:
    image: node@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    container_name: ezclick-satellite
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    working_dir: /app
    environment:
      SATELLITE_CACHE: /cache
    volumes:
      - ./app:/app:ro
      - ./cache:/cache
    command: [node, server.cjs]
